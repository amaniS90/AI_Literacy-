</head>
<body class="min-h-screen py-10 px-4 sm:px-6 lg:px-8">

        <!-- الهيدر الخاص بالحقيبة -->
        <div class="bg-gradient-to-r from-blue-900 to-indigo-800 text-white p-8 text-center">
            <span class="inline-block bg-blue-700/60 text-blue-100 text-xs font-medium px-3 py-1 rounded-full mb-3">برنامج تدريبي توعوي وتطبيقي</span>

                <span>الاختبار القبلي للمشاركين</span>

        <!-- محتوى النموذج -->

                    <span class="w-2 h-2 bg-blue-600 rounded-full"></span> بيانات المشارك

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">الاسم الكريم (اختياري)</label>

                    </div>
                </div>
            </div>

            <!-- الأسئلة العشرة من الحقيبة -->

                <!-- س 1 -->

                        </label>
                        <label class="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-50 cursor-pointer">
                            <input type="radio" name="q1" value="مجموعة من الأجهزة والمعدات الصلبة التي لا تعتمد على البرمجيات." class="text-blue-600 focus:ring-blue-500">
                            <span>مجموعة من الأجهزة والمعدات الصلبة التي لا تعتمد على البرمجيات.</span>
                        </label>
                    </div>
                </div>

                <!-- س 2 -->
                <div class="p-5 rounded-xl border border-slate-200 bg-white shadow-xs">
                    <label class="block font-bold text-slate-800 mb-3">2. يقصد بمصطلح "الذكاء الاصطناعي التوليدي" (GenAI):</label>
                    <div class="space-y-2 text-sm text-slate-700">
                        <label class="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-50 cursor-pointer">

                        </label>
                        <label class="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-50 cursor-pointer">

                            <span>أنظمة مخصصة فقط للأرشفة الإلكترونية وحفظ المستندات الرسمية.</span>
                        </label>

                            <input type="radio" name="q2" value="برمجيات تحليل الأرقام والعمليات الحسابية البسيطة." class="text-blue-600 focus:ring-blue-500">
                            <span>برمجيات تحليل الأرقام والعمليات الحسابية البسيطة.</span>
                        </label>
                    </div>
                </div>

                            <input type="radio" name="q3" value="برامج لترجمة اللغات الأجنبية فقط عبر القواميس التقليدية." class="text-blue-600 focus:ring-blue-500" required>
